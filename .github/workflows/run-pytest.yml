name: Run pytests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs: null

jobs:
  pytest:
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest] # integration tests start PostgreSQL with docker, which ubuntu runners have
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Installs pipestat with uv, starts a throwaway PostgreSQL in docker, and runs every
    # test (unit + tests/integration) with RUN_INTEGRATION_TESTS=true.
    - name: Run unit and integration tests
      run: tests/scripts/test-integration.sh --cov=./ --cov-report=xml
