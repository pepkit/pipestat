name: Pipestat Test Coverage

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [ dev ]

jobs:
  cli-coverage-report:
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ ubuntu-latest ] # integration tests start PostgreSQL with docker, which ubuntu runners have
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Runs every test (unit + tests/integration) against a throwaway PostgreSQL in docker
      - name: Run tests with coverage
        run: tests/scripts/test-integration.sh --cov=./ --cov-report=html

      - name: Install smokeshow
        run: uv pip install smokeshow

      - run: .venv/bin/smokeshow upload htmlcov
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          #SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 50
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
